name: run-ci

# a new push to a pull request replaces the runs of the commits it supersedes, so they stop
# holding runners; runs for any other event are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches:
      - main

jobs:
  conventions:
    uses: ./.github/workflows/pr-conventions.yaml
  stage-1:
    uses: ./.github/workflows/pr-stage-1.yaml
  stage-2:
    uses: ./.github/workflows/pr-stage-2.yaml
    needs: [stage-1]
  conda:
    uses: ./.github/workflows/pr-conda.yaml
    needs: [stage-1]

# End of file
